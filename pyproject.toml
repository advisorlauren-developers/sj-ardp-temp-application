[project]
name = "kbeval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "fonttools>=4.65.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pypdf>=6.19.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
filterwarnings = [
    # starlette's own import-time deprecation; nothing here can act on it
    "ignore:.*BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[project.scripts]
kbeval = "kbeval.cli:app"
