[project]
name = "kbeval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kbeval = "kbeval.cli:app"