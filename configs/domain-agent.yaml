# domain-agent 산출물을 pack 축에 올린다 (2026-09-21).
#
# base.yaml 위에 겹쳐 쓴다:
#   uv run kbeval plan -c configs/base.yaml -c configs/domain-agent.yaml
#
# **두 pack의 경계가 같다.** 그래서 둘의 차이는 의미 확장 하나뿐이고,
# 기존 raw/mid/full(고정 크기·heading 분할)과 달리 "경계 차이"가 섞이지 않는다.

source:
  adapter: domain_agent
  path: data/domain-agent-export
  params: {}

packs:
  da_raw:
    name: da_raw
    chunker: domain_agent
    chunk_chars: 0            # 경계는 domain-agent가 정한다. 이 값은 쓰이지 않는다
    chunk_overlap: 0
    transforms: []
  da_full:
    name: da_full
    chunker: domain_agent
    chunk_chars: 0
    chunk_overlap: 0
    transforms: [domain_agent_enrich]

eval:
  # 의미 확장 부분만 겨냥한다 — scripts/make_domain_agent_questions.py 참조.
  # (이전 5문항 세트 domain_agent_questions.jsonl은 원문에 답이 있어 두 pack을 가르지 못한다)
  questions: data/eval/da_expansion_questions.jsonl
  intents: [qa]
  gold_overlap_ratio: 0.3

sweep:
  agent: [mock_a, mock_b]
  mode:  [bare, rag, oracle_ref]
  pack:  [da_raw, da_full]
