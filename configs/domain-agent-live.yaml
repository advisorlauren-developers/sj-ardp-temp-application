# 실제 모델로 Q&A 화면을 띄운다 (2026-09-21).
#
#   uv run kbeval web -c configs/base.yaml \
#                     -c configs/domain-agent.yaml \
#                     -c configs/domain-agent-live.yaml
#
# **왜 별도 파일인가.** domain-agent.yaml은 mock으로 돈다 — 배관 검증용이고
# 비용이 0이다. 이 파일만 실제 호출을 연다. 두 상태를 한 파일에 두면
# "지금 돈이 나가는가"를 파일 이름으로 알 수 없다.
#
# **모델은 30B급으로 고정한다.** 배치 대상이 온프렘이라 120B는 전제가 다르다.
# 더 큰 모델로 재면 "pack이 도왔다"와 "모델이 컸다"가 같은 칸에 섞인다.
#
# 화면(/qa)은 sweep.agent[0]으로 답한다 (web.py answer_payload).

agents:
  qwen32b:
    provider: bedrock
    endpoint: mantle          # OpenAI 호환 HTTP. BEDROCK_API_KEY를 쓴다
    id: "qwen.qwen3-32b-v1:0"
    family: dense
    params_b: 32
    thinking: true            # <think> 태그를 낸다. base.strip_thinking이 떼어낸다
    notes: "온프렘 배치 대상과 같은 체급. 120B로 재면 pack 효과와 모델 체급이 섞인다"

llm:
  # 기본값 512로는 qwen3가 추론에 예산을 다 쓰고 본문이 비어 'reasoning_only'로
  # 떨어진다. 답변 길이가 아니라 추론 몫을 위한 여유다.
  max_tokens: 1536
  timeout_s: 120

sweep:
  agent: [qwen32b]
  mode:  [bare, rag, oracle_ref]
  pack:  [da_raw, da_full]

# qwen3는 temperature=0에서도 답이 갈린다(추론 단계가 미세 차이를 키운다).
# 같은 질문에 da_raw가 RACH를 짚기도, SCG Pcell로 새기도 했다 (2026-09-23).
# 한 번 돌린 비교는 믿을 수 없으므로 문항당 3회. 통제변수라 해시에 들어간다.
fixed:
  n_repeat: 3
