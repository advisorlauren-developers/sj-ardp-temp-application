# S1: 스윕에 필요한 블록만. 이후 단계에서 Protocol과 함께 블록을 추가한다.
run:
  name: qa-poc
  seed: 0
  out_dir: runs

# ---- 축 1: 모델 -------------------------------------------------------------
agents:
  mock_a: {provider: mock, id: "mock-a", family: dense}
  mock_b: {provider: mock, id: "mock-b", family: dense}

# ---- 지식 원천 (S2) ---------------------------------------------------------
source:
  adapter: pdf_docs             # SOURCES 레지스트리 키. jira_export로 교체 가능
  path: data/raw/docs
  params:
    glob: "**/*.pdf"
    cache_dir: data/extracted   # 추출 텍스트 = 좌표계. 캐시가 그걸 고정한다
    headings: true              # PDF outline(없으면 패턴)으로 절 제목을 마크업

# ---- 축 3: pack (ai-ready 처리 수준) ----------------------------------------
packs:
  raw:
    name: raw
    chunker: flat                 # 일부러 나쁜 기준선
    chunk_chars: 900
    chunk_overlap: 120
    transforms: []
  mid:
    name: mid
    chunker: heading
    chunk_chars: 900
    chunk_overlap: 120
    transforms: [strip_boilerplate, inline_meta]
  full:
    name: full
    chunker: heading
    chunk_chars: 900
    chunk_overlap: 120
    transforms: [strip_boilerplate, normalize_terms, dedup, inline_meta]

# ---- 평가 데이터 (S4) -------------------------------------------------------
eval:
  questions: data/eval/sample_questions.jsonl
  intents: [qa]
  gold_overlap_ratio: 0.3

# ---- 검색 (S5) --------------------------------------------------------------
# pack 간 고정. 인덱스만 pack 종속이고 그게 측정 대상이다.
retrieval:
  retriever: bm25
  candidate_k: 10               # 검색 깊이. 컨텍스트 양은 토큰 예산이 정한다
  bm25: {k1: 1.2, b: 0.75}
  tokenizer: {bigrams: true}    # 한글 음절 bigram. false면 공백 토큰만

# ---- 채점 (S8) --------------------------------------------------------------
# judge는 고정이고 candidate보다 훨씬 강해야 한다. 30B를 30B로 채점하면 신뢰구간이 무의미하다.
judge:
  agent: {provider: mock_judge, id: "mock-judge", family: dense}

scoring:
  scorers: [retrieval, judge]
  ks: [1, 3, 5, 10]
  min_headroom: 0.05            # 이 미만이면 realization 분모가 잡음이다

# ---- 축 2: mode (지식 주입 방식) --------------------------------------------
sweep:
  agent: [mock_a, mock_b]
  mode:  [bare, rag, oracle_ref]
  pack:  [raw, mid, full]

fixed:
  context_token_budget: 3000    # top_k가 아니라 토큰 예산이 통제변수
  max_injected_chunks: 8
  chars_per_token: 2.0
  prompt_version: v1
  n_repeat: 1